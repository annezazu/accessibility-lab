name: Feature Request
description: Suggest a new feature, module, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! Please follow the [Contributing Guidelines](https://github.com/WordPress/accessibility-lab/blob/main/CONTRIBUTING.md) and search existing issues before filing a new one.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      description: See the [readme](https://github.com/WordPress/accessibility-lab/blob/main/readme.txt) for what these categories mean.
      options:
        - Stable feature
        - Experiment
        - Core Track
        - New module
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is, if any.
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate.
          required: true
