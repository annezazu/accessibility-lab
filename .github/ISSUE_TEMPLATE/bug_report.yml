name: Bug Report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please follow the [Contributing Guidelines](https://github.com/WordPress/accessibility-lab/blob/main/CONTRIBUTING.md) and search existing issues before filing a new one.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If applicable, add screenshots or a screen recording to help explain the problem.
    validations:
      required: false

  - type: dropdown
    id: modules
    attributes:
      label: Which module(s) are affected?
      multiple: true
      options:
        - Media Library view options
        - Block Validation Framework
        - Core block accessibility rules
        - Validation settings
        - Not sure / other
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.7
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Accessibility Lab version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us track this down (browser, theme, other active plugins, console errors, etc).
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate.
          required: true
