name: Bug Report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please follow the [Contributing Guidelines](https://github.com/WordPress/accessibility-lab/blob/main/CONTRIBUTING.md) and search existing issues before filing a new one.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If applicable, add screenshots or a screen recording to help explain the problem.
    validations:
      required: false

  - type: dropdown
    id: modules
    attributes:
      label: Which module(s) are affected?
      multiple: true
      options:
        - Media Library: add view options
        - Block Validation Framework
        - Core block accessibility rules
        - Validation settings
        - Accessibility Lab settings page
        - Build tools / CI
        - Not sure / other
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.7 or trunk
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Accessibility Lab version
      placeholder: e.g. 0.1.0 or main
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2 (if applicable)
    validations:
      required: false

  - type: input
    id: assistive-tech
    attributes:
      label: Browser / Assistive technology
      placeholder: e.g. Chrome 128 with NVDA / VoiceOver / Safari / Keyboard only
      description: If this issue involves keyboard navigation, screen readers, or specific browsers, please note them here.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help diagnose the issue (theme, other active plugins, browser console errors, etc).
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate.
          required: true
